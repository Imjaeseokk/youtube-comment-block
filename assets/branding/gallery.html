<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>댓글 잠시 멈춤 · 아이콘 후보 5종</title><style>
*{box-sizing:border-box}body{font:15px/1.6 Arial,sans-serif;margin:0;padding:48px;background:#fff;color:#000}main{max-width:1400px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:24px}h1{font-size:32px;margin:0}header p{font-size:14px;color:#555}button{border:1px solid #000;border-radius:20px;padding:8px 18px;background:transparent;color:inherit;font:inherit;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px;margin-top:36px}.art{aspect-ratio:1;display:grid;place-items:center;border:1px solid #ddd;border-radius:16px;background:repeating-conic-gradient(#eee 0% 25%,#fff 0% 50%) 0/18px 18px}.art img{width:100%;height:100%;object-fit:contain}h2{font-size:17px;margin:14px 0 4px}p{margin:0}small{font-size:12px;color:#555}.sizes{display:flex;gap:14px;align-items:center;margin-top:18px;min-height:50px}.downloads{display:flex;gap:12px;font-size:12px;margin-top:12px}a{color:inherit}footer{margin-top:40px;border-top:1px solid #ddd;padding-top:18px;font-size:12px;color:#555}html[dark] body{background:#000;color:#fff}html[dark] .art{background:repeating-conic-gradient(#222 0% 25%,#000 0% 50%) 0/18px 18px;border-color:#444}html[dark] small,html[dark] header p,html[dark] footer{color:#aaa}html[dark] button{border-color:#fff}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}body{padding:24px}}
</style></head><body><main><header><div><h1>댓글 잠시 멈춤</h1><p>아이콘 후보 5종 · 흑백 + #FF0033 · 정면 · 투명 배경 · 그림자 없음</p></div><button id="theme">어두운 배경에서 보기</button></header><section class="grid"></section><footer>체크무늬는 투명도를 확인하기 위한 화면 표시이며, 아이콘 파일에 포함되지 않습니다. 후보 01을 패키지에 임시 적용했습니다. 128px 아이콘에는 규격에 맞춘 투명 여백을 두었습니다.</footer></main><script>
const names=['기본 윤곽형','검정 채움형','넓은 말풍선형','중앙 금지형','둥근 말풍선형'];const descriptions=['흰 말풍선, 우측 상단 금지 표시','검정 말풍선, 우측 하단 금지 표시','가로 비율 강조, 가벼운 선','말풍선 전체 위에 큰 금지 표시','큰 곡률, 우측 하단 금지 표시'];
names.forEach((name,index)=>{const id=String(index+1).padStart(2,'0');const article=document.createElement('article');article.innerHTML=`<div class="art"><img src="candidates/candidate-${id}/icon-512.png" alt="후보 ${id} ${name}"></div><h2>${id} · ${name}</h2><small>${descriptions[index]}</small><div class="sizes">${[16,32,48].map(size=>`<img width="${size}" height="${size}" src="candidates/candidate-${id}/icon-${size}.png" alt="${size}px">`).join('')}</div><div class="downloads"><a href="candidates/candidate-${id}/icon.svg">SVG</a><a href="candidates/candidate-${id}/icon-1024.png">PNG 1024</a></div>`;document.querySelector('.grid').append(article)});
document.querySelector('#theme').onclick=e=>{const dark=document.documentElement.toggleAttribute('dark');e.target.textContent=dark?'밝은 배경에서 보기':'어두운 배경에서 보기'};
</script></body></html>
