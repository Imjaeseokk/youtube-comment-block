name: Extension checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run assets:check
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: youtube-comment-block
          path: dist/*.zip
