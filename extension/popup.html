<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>YouTube Comment Block</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><img src="icons/icon48.png" width="32" height="32" alt=""><span>YouTube Comment Block</span></header>
  <h1>영상 먼저.<br>내 생각 먼저.</h1>
  <p>유튜브 댓글은 기본으로 가려집니다. 댓글 영역에서 <strong>“예, 댓글 보기”</strong>를 선택하면 이 영상의 댓글만 열립니다.</p>
  <div class="status"><span aria-hidden="true"></span> 다음 영상에서는 다시 잠시 멈춤</div>
  <p class="note">연구 이야기와 짧은 질문이 습관적인 스크롤에 작은 여유를 더합니다.</p>
  <footer>YouTube Comment Block · 0.1.0<br>외부 데이터 전송 없음 · YouTube와 무관한 독립 확장 프로그램</footer>
  <script src="popup.js"></script>
</body>
</html>
